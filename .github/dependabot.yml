# Dependency updates (cahier SCR-10; security plan G-3): once a week, grouped so
# each ecosystem opens at most a few pull requests. Each one runs the full CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # A major version changes behaviour: it is upgraded by hand, one package at a
      # time, in its own reviewed pull request. Minor and patch updates come here.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
