name: Shared rules drift

# ARC-12: CI checks the shared rules against the web commit recorded in
# packages/core/SOURCE. This report compares them with the web repository's
# main every day: a red run means a rule changed there and the backend needs
# `npm run sync:core` in a pull request. The job summary lists the files.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Rules drift from Nexora-Saas main (ARC-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yahyanaim/Nexora-Saas
          ref: main
          path: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/sync-core.mjs web --check
